name: "❓ Support / Question"
description: Ask for help with hardware, flashing, Wi-Fi, or Home Assistant setup
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking! Please check the [Documentation](https://github.com/demonkazuya/CYD-HA-Dashboard#readme) and [Troubleshooting Guide](https://github.com/demonkazuya/CYD-HA-Dashboard/blob/main/docs/TROUBLESHOOTING.md) first — most common setup issues (such as 2.4 GHz Wi-Fi requirements or Long-Lived Token creation) are detailed there.

  - type: textarea
    id: what_trying_to_do
    attributes:
      label: What are you trying to configure or achieve?
      description: Describe your setup goals.
      placeholder: "e.g., I'm trying to connect my ESP32-2432S028R to my local Home Assistant server and add climate controls..."
    validations:
      required: true

  - type: textarea
    id: what_tried
    attributes:
      label: What have you tried so far?
      description: Steps you've already taken, and what happened.
      placeholder: "e.g., Flashed the factory binary, connected to the setup hotspot, entered token, but screen shows..."
    validations:
      required: false

  - type: dropdown
    id: device_model
    attributes:
      label: CYD / ESP32 Hardware Model
      options:
        - "ESP32-2432S028R (2.8\" Resistive Touch - Standard CYD)"
        - "ESP32-2432S028C (2.8\" Capacitive Touch)"
        - "ESP32-3248S035 (3.5\" Display)"
        - "ESP32-2432S024 (2.4\" Display)"
        - "Other / Custom Hardware"
    validations:
      required: false

  - type: input
    id: firmware_version
    attributes:
      label: Firmware Version
      placeholder: "e.g., v0.1.0"
    validations:
      required: false
